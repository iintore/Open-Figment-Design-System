name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build all packages
        run: npm run packages:build
      - name: Unit tests
        run: npm run packages:test
      - name: publint + Are the Types Wrong, pack
        run: npm run packages:check
      - name: Install with npm, pnpm, Yarn 1 and Yarn 4, build and run in Chromium
        run: node scripts/packages/install-test.mjs
