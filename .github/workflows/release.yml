name: Release packages

# Publishes @krackedui/open-figment to npm when a version tag is pushed:
#   npm run packages:version -- 1.2.0 && npm run packages:build
#   git commit -am "Release 1.2.0" && git tag v1.2.0 && git push --follow-tags
# Uses npm Trusted Publishing: npm trusts this workflow directly (OpenID Connect), so there is no
# token to store or renew. Set up once on npmjs.com: package Settings → Trusted Publisher →
# GitHub Actions, repository iintore/Open-Figment-Design-System, workflow release.yml.
# Published with npm provenance.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run packages:build
      - name: Tag matches packages/version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./packages/version.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run packages:test
      - run: npm run packages:check
      - run: node scripts/packages/install-test.mjs npm pnpm
      - name: npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1
      - name: Publish
        run: npm publish --workspaces --access public
